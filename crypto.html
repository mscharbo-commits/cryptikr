<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Crypto — Cryptikr</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://s3.tradingview.com/tv.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0A0E1A;--surface:#111827;--surface2:#1A2236;--border:#1E2D45;
  --text:#F0F4FF;--text2:#94A3B8;--text3:#475569;
  --accent:#F59E0B;--green:#10B981;--green-bg:rgba(16,185,129,.12);
  --red:#EF4444;--red-bg:rgba(239,68,68,.12);--radius:12px;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}

/* NAV */
header{background:rgba(10,14,26,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:100;}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
.logo-icon{width:30px;height:30px;background:linear-gradient(135deg,#F59E0B,#EF4444);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;}
.logo-name{font-size:16px;font-weight:800;color:#fff;letter-spacing:-.4px;}
.logo-name span{color:var(--accent);}
.back-btn{font-size:13px;color:var(--text2);text-decoration:none;padding:5px 12px;border-radius:7px;border:1px solid var(--border);transition:all .15s;}
.back-btn:hover{border-color:var(--accent);color:var(--accent);}
.search-wrap{display:flex;gap:6px;}
.search-wrap input{background:var(--surface2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:13px;padding:6px 12px;width:180px;font-family:'Inter',sans-serif;outline:none;}
.search-wrap input:focus{border-color:var(--accent);}
.search-wrap input::placeholder{color:var(--text3);}
.go-btn{background:var(--accent);color:#000;border:none;border-radius:7px;padding:6px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;}

/* MAIN */
.main{max-width:1100px;margin:0 auto;padding:24px 24px 48px;}

/* COIN HEADER */
.coin-header{display:flex;align-items:flex-start;gap:16px;margin-bottom:24px;}
.coin-logo{width:52px;height:52px;border-radius:12px;object-fit:contain;border:1px solid var(--border);}
.coin-logo-fb{width:52px;height:52px;border-radius:12px;background:linear-gradient(135deg,#F59E0B,#EA580C);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#fff;flex-shrink:0;}
.coin-name{font-size:26px;font-weight:800;letter-spacing:-.5px;color:var(--text);}
.coin-sym{font-size:13px;font-weight:600;color:var(--text3);background:var(--surface2);border:1px solid var(--border);padding:2px 8px;border-radius:5px;font-family:'JetBrains Mono',monospace;}
.coin-rank{font-size:12px;color:var(--text3);background:var(--surface2);border:1px solid var(--border);padding:2px 8px;border-radius:5px;}
.coin-price{font-size:32px;font-weight:800;letter-spacing:-1px;font-family:'JetBrains Mono',monospace;color:var(--text);}
.coin-chg{font-size:14px;font-weight:600;padding:3px 9px;border-radius:6px;margin-left:8px;}
.coin-chg.up{color:var(--green);background:var(--green-bg);}
.coin-chg.dn{color:var(--red);background:var(--red-bg);}
.coin-updated{font-size:11px;color:var(--text3);margin-top:4px;}

/* GRID */
.grid{display:grid;grid-template-columns:1fr 300px;gap:20px;}
.card{background:#111827;border:1px solid #1E2D45;border-radius:var(--radius);padding:20px;margin-bottom:16px;}
.card-title{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#475569;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid #1E2D45;}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #1A2236;font-size:13px;}
.stat-row:last-child{border-bottom:none;}
.stat-label{color:#94A3B8;}
.stat-val{font-weight:600;font-family:'JetBrains Mono',monospace;font-size:12px;color:#F0F4FF;}
.perf-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.perf-label{width:32px;font-size:12px;color:var(--text3);}
.perf-bar-bg{flex:1;height:4px;background:var(--surface2);border-radius:2px;overflow:hidden;}
.perf-bar-fill{height:100%;border-radius:2px;}
.perf-val{width:60px;text-align:right;font-size:12px;font-weight:600;font-family:'JetBrains Mono',monospace;}
.up{color:var(--green);} .dn{color:var(--red);}
.loading{text-align:center;padding:80px;color:var(--text3);font-size:15px;}

/* POWERED BY */
.powered{text-align:center;padding:24px;border-top:1px solid var(--border);margin-top:8px;font-size:11px;color:var(--text3);}
.powered a{color:var(--text3);text-decoration:none;}
.powered a:hover{color:var(--accent);}
</style>
</head>
<body>

<header>
  <div style="display:flex;align-items:center;gap:14px;">
    <a href="/" class="logo">
      <div class="logo-icon">₿</div>
      <div class="logo-name">Crypti<span>kr</span></div>
    </a>
    <a href="/" class="back-btn">← Back</a>
  </div>
  <div class="search-wrap">
    <input type="text" id="srch" placeholder="Search coin..." onkeydown="if(event.key==='Enter')goSearch()"/>
    <button class="go-btn" onclick="goSearch()">Go</button>
  </div>
</header>

<div id="main-content">
  <div class="loading">Loading...</div>
</div>

<script>
var currentCoinId = '';

var TV_SYMS = {
  'bitcoin':'BINANCE:BTCUSDT','ethereum':'BINANCE:ETHUSDT','solana':'BINANCE:SOLUSDT',
  'ripple':'BINANCE:XRPUSDT','dogecoin':'BINANCE:DOGEUSDT','cardano':'BINANCE:ADAUSDT',
  'avalanche-2':'BINANCE:AVAXUSDT','polkadot':'BINANCE:DOTUSDT','chainlink':'BINANCE:LINKUSDT',
  'matic-network':'BINANCE:MATICUSDT','uniswap':'BINANCE:UNIUSDT','litecoin':'BINANCE:LTCUSDT',
  'near':'BINANCE:NEARUSDT','aptos':'BINANCE:APTUSDT','arbitrum':'BINANCE:ARBUSDT',
  'cosmos':'BINANCE:ATOMUSDT','shiba-inu':'BINANCE:SHIBUSDT','tron':'BINANCE:TRXUSDT',
  'the-open-network':'BINANCE:TONUSDT','sui':'BINANCE:SUIUSDT','pepe':'BINANCE:PEPEUSDT',
  'bitcoin-cash':'BINANCE:BCHUSDT','aave':'BINANCE:AAVEUSDT','maker':'BINANCE:MKRUSDT',
};

function fmt(n) {
  if (n === null || n === undefined) return '—';
  n = parseFloat(n); if (isNaN(n)) return '—';
  if (n >= 1e12) return '$' + (n/1e12).toFixed(2) + 'T';
  if (n >= 1e9)  return '$' + (n/1e9).toFixed(2) + 'B';
  if (n >= 1e6)  return '$' + (n/1e6).toFixed(2) + 'M';
  if (n >= 1e3)  return '$' + n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  if (n >= 1)    return '$' + n.toFixed(2);
  return '$' + n.toFixed(6);
}
function fmtNum(n) {
  if (!n) return '—'; n = parseFloat(n);
  if (n >= 1e9) return (n/1e9).toFixed(2)+'B';
  if (n >= 1e6) return (n/1e6).toFixed(2)+'M';
  return n.toLocaleString();
}
function fmtPct(n) {
  if (n === null || n === undefined) return '—';
  var v = parseFloat(n); if (isNaN(v)) return '—';
  return (v >= 0 ? '+' : '') + v.toFixed(2) + '%';
}
function statRow(l,v) { return '<div class="stat-row"><span class="stat-label">'+l+'</span><span class="stat-val">'+v+'</span></div>'; }
function perfRow(l,val) {
  var n = parseFloat(val)||0, w = Math.min(Math.abs(n)*2,100);
  var col = n>=0?'var(--green)':'var(--red)', cls = n>=0?'up':'dn';
  return '<div class="perf-row"><span class="perf-label">'+l+'</span><div class="perf-bar-bg"><div class="perf-bar-fill" style="width:'+w+'%;background:'+col+'"></div></div><span class="perf-val '+cls+'">'+fmtPct(val)+'</span></div>';
}

function renderCoin(c) {
  var price = parseFloat(c.price)||0;
  var chg24 = parseFloat(c.chg24)||0;
  var sym   = c.sym || currentCoinId.toUpperCase();
  var name  = c.name || sym;
  var cls   = chg24 >= 0 ? 'up' : 'dn';
  var priceStr = price >= 1000 ? '$'+Math.round(price).toLocaleString()
    : price >= 1 ? '$'+price.toFixed(2) : '$'+price.toFixed(6);
  var logo = (c.image && c.image.large)
    ? '<img class="coin-logo" src="'+c.image.large+'" onerror="this.style.display=\'none\'"/>'
    : '<div class="coin-logo-fb">'+sym.slice(0,2)+'</div>';
  var volMktCap = (c.volume24 && c.marketCap) ? (c.volume24/c.marketCap*100).toFixed(2)+'%' : '—';
  var pctCirc = (c.circSupply && c.maxSupply) ? (c.circSupply/c.maxSupply*100).toFixed(1)+'%'
    : c.maxSupply === null ? 'No max' : '—';

  var html = '<div class="main">'
    + '<div class="coin-header">'
    + logo
    + '<div>'
    + '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap;">'
    + '<span class="coin-name">'+name+'</span>'
    + '<span class="coin-sym">'+sym+'</span>'
    + (c.rank ? '<span class="coin-rank">#'+c.rank+'</span>' : '')
    + '</div>'
    + '<div style="display:flex;align-items:baseline;gap:4px;">'
    + '<span class="coin-price">'+priceStr+'</span>'
    + '<span class="coin-chg '+cls+'">'+fmtPct(chg24)+' (24h)</span>'
    + '</div>'
    + '<div class="coin-updated">Real-time · CoinGecko · Powered by PulseStock</div>'
    + '</div></div>'

    + '<div class="grid"><div>'
    + '<div class="card" style="padding:0;overflow:hidden;">'
    + '<div style="padding:14px 20px 10px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;">'
    + '<span style="font-size:13px;font-weight:600;color:var(--text);">Price Chart</span>'
    + '<span style="font-size:11px;color:var(--text3);">RSI · MACD · All timeframes</span>'
    + '</div>'
    + '<div id="tv-container" style="height:520px;width:100%;"></div>'
    + '</div>'

    + '<div class="card"><div class="card-title">Price Performance</div>'
    + perfRow('24h', chg24) + perfRow('7D', c.chg7) + perfRow('30D', c.chg30) + perfRow('1Y', c.chg1y)
    + '</div></div>'

    + '<div>'
    + '<div class="card"><div class="card-title">Market Stats</div>'
    + statRow('Market Cap', fmt(c.marketCap))
    + statRow('Fully Diluted', fmt(c.fdv))
    + statRow('24h Volume', fmt(c.volume24))
    + statRow('Vol/Mkt Cap', volMktCap)
    + statRow('Circulating', c.circSupply ? fmtNum(c.circSupply)+' '+sym : '—')
    + statRow('Total Supply', c.totalSupply ? fmtNum(c.totalSupply)+' '+sym : '∞')
    + statRow('Max Supply', c.maxSupply ? fmtNum(c.maxSupply)+' '+sym : '∞')
    + '</div>'

    + '<div class="card"><div class="card-title">All-Time Records</div>'
    + statRow('All-Time High', c.ath ? fmt(c.ath)+(c.athChg?'<span class="'+(c.athChg>=0?'up':'dn')+'"> '+fmtPct(c.athChg)+'</span>':'') : '—')
    + statRow('ATH Date', c.athDate ? new Date(c.athDate).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '—')
    + statRow('All-Time Low', c.atl ? fmt(c.atl)+(c.atlChg?'<span class="'+(c.atlChg>=0?'up':'dn')+'"> '+fmtPct(c.atlChg)+'</span>':'') : '—')
    + statRow('ATL Date', c.atlDate ? new Date(c.atlDate).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '—')
    + '</div>'

    + '<div class="card"><div class="card-title">Supply & Sentiment</div>'
    + statRow('% Circulating', pctCirc)
    + statRow('Sentiment ▲', c.sentiment_up ? '<span class="up">'+parseFloat(c.sentiment_up).toFixed(0)+'%</span>' : '—')
    + statRow('Sentiment ▼', c.sentiment_dn ? '<span class="dn">'+parseFloat(c.sentiment_dn).toFixed(0)+'%</span>' : '—')
    + statRow('CoinGecko Score', c.coingecko_score ? parseFloat(c.coingecko_score).toFixed(0)+'/100' : '—')
    + '</div></div></div></div>';

  document.getElementById('main-content').innerHTML = html;
  document.title = sym + ' ' + priceStr + ' — Cryptikr';
  setTimeout(function() { loadTVChart(currentCoinId, c.tvSym); }, 400);
}

function loadTVChart(coinId, tvSymOverride) {
  var el = document.getElementById('tv-container');
  if (!el) return;
  var sym = tvSymOverride || TV_SYMS[coinId] || ('BINANCE:'+coinId.toUpperCase().replace(/-/g,'')+'USDT');
  var src = 'https://s.tradingview.com/widgetembed/?symbol='+encodeURIComponent(sym)
    +'&interval=D&theme=dark&style=1&locale=en&toolbar_bg=111827'
    +'&withdateranges=1&allow_symbol_change=1'
    +'&studies=RSI%40tv-basicstudies%1FMACD%40tv-basicstudies'
    +'&showpopupbutton=1';
  el.innerHTML = '<iframe src="'+src+'" style="width:100%;height:520px;border:none;" allowtransparency="true" allowfullscreen></iframe>';
}

async function loadCoin(coinId) {
  try {
    var resp = await fetch('/api/coin?id='+encodeURIComponent(coinId));
    if (!resp.ok) { showNotFound(coinId); return; }
    var c = await resp.json();
    if (c.error) { showNotFound(coinId); return; }
    renderCoin(c);
  } catch(e) {
    document.getElementById('main-content').innerHTML = '<div class="loading">Failed to load. <a href="javascript:location.reload()" style="color:var(--accent);">Try again</a></div>';
  }
}

function showNotFound(id) {
  document.getElementById('main-content').innerHTML = '<div class="loading"><h2 style="margin-bottom:8px;">Not found</h2><p>Could not find "'+id+'"</p><br/><a href="/" style="color:var(--accent);">← Back to Cryptikr</a></div>';
}

function goSearch() {
  var val = document.getElementById('srch').value.trim().toUpperCase();
  if (!val) return;
  var MAP = {'BTC':'bitcoin','ETH':'ethereum','SOL':'solana','XRP':'ripple','DOGE':'dogecoin','ADA':'cardano','AVAX':'avalanche-2','DOT':'polkadot','LINK':'chainlink','MATIC':'matic-network','UNI':'uniswap','LTC':'litecoin','NEAR':'near','APT':'aptos','ARB':'arbitrum','ATOM':'cosmos','SHIB':'shiba-inu','TRX':'tron','TON':'the-open-network','SUI':'sui','PEPE':'pepe'};
  window.location.href = '/crypto/' + (MAP[val] || val.toLowerCase());
}

currentCoinId = window.location.pathname.replace(/\/crypto\/?/,'').replace(/\/+$/,'').toLowerCase().trim();
if (!currentCoinId) showNotFound('unknown');
else loadCoin(currentCoinId);
</script>

<div class="powered">
  Powered by <a href="https://pulsestock-nu.vercel.app" target="_blank">PulseStock</a> · Data via CoinGecko · Not financial advice
</div>
</body>
</html>
